name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Isolate the public npm registry
        run: |
          npm_config="${RUNNER_TEMP}/identity-public.npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "${npm_config}"
          echo "NPM_CONFIG_USERCONFIG=${npm_config}" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Activate the reviewed package manager
        run: corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org/

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test
