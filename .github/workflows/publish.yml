# Publishes the exact tarball prepared from a stable GitHub release tag.
# Authentication is npm trusted-publisher OIDC only; no token fallback exists.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/identity-public.npmrc

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Refuse invalid normal release metadata
        run: node scripts/release-package.mjs normal-release-check --expected-release-commit "${RELEASE_COMMIT}"

      - name: Fetch the protected release branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Configure approved release signers
        shell: bash
        run: |
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS is required"
            exit 1
          fi
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"

      - name: Isolate the public npm registry
        run: printf 'registry=https://registry.npmjs.org/\n' > "${NPM_CONFIG_USERCONFIG}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        run: npm install --global npm@11.18.0 --registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --registry https://registry.npmjs.org/

      - name: Run the gate
        run: npm run format:check && npm run check && npm test && npm audit --omit=dev --audit-level=high

      - name: Prepare and verify the release tarball
        run: npm run release:pack -- -- --require-clean --require-main-ancestor --require-release-tag --expected-release-commit "${RELEASE_COMMIT}"

      - name: Upload the prepared release
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: identity-release-${{ github.run_id }}
          path: .release/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Refuse invalid normal release metadata
        run: node scripts/release-package.mjs normal-release-check --expected-release-commit "${RELEASE_COMMIT}"

      - name: Set up Node.js and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify the public npm registry
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: identity-release-${{ github.run_id }}
          path: .release

      - name: Publish the verified prepared tarball
        run: npm run release:publish -- -- --expected-release-commit "${RELEASE_COMMIT}"
